apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo-route
  namespace: trafficops
spec:
  parentRefs:
    - name: trafficops
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /demo
      backendRefs:
        - name: demo-v1
          port: 8080
          weight: 100
        - name: demo-v2
          port: 8080
          weight: 0
