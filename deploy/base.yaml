apiVersion: v1
kind: Namespace
metadata:
  name: trafficops
  labels:
    app.kubernetes.io/part-of: trafficops
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-v1
  namespace: trafficops
  labels:
    app.kubernetes.io/name: demo
    app.kubernetes.io/version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demo
      app.kubernetes.io/version: v1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo
        app.kubernetes.io/version: v1
    spec:
      containers:
        - name: demo
          image: trafficops-demo:0.1.0
          imagePullPolicy: Never
          env:
            - name: APP_VERSION
              value: v1
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 96Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo-v1
  namespace: trafficops
spec:
  selector:
    app.kubernetes.io/name: demo
    app.kubernetes.io/version: v1
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-v2
  namespace: trafficops
  labels:
    app.kubernetes.io/name: demo
    app.kubernetes.io/version: v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demo
      app.kubernetes.io/version: v2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo
        app.kubernetes.io/version: v2
    spec:
      containers:
        - name: demo
          image: trafficops-demo:0.1.0
          imagePullPolicy: Never
          env:
            - name: APP_VERSION
              value: v2
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 96Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo-v2
  namespace: trafficops
spec:
  selector:
    app.kubernetes.io/name: demo
    app.kubernetes.io/version: v2
  ports:
    - name: http
      port: 8080
      targetPort: http
