apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: trafficops-panel
  namespace: trafficops
spec:
  parentRefs:
    - name: trafficops
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /web
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: 100s
        backendRequest: 100s
      backendRefs:
        - name: trafficops-controller
          port: 8081
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: trafficops-panel-idle-timeout
  namespace: trafficops
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: trafficops-panel
  timeout:
    http:
      # Close idle upstream connections before Uvicorn's 30s keep-alive timeout.
      connectionIdleTimeout: 15s
