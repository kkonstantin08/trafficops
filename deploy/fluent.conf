<source>
  @type tail
  path /var/log/pods/trafficops_demo-v1-*_*/*/*.log,/var/log/pods/trafficops_demo-v2-*_*/*/*.log
  pos_file /fluentd-buffers/demo.pos
  tag trafficops.app
  read_from_head true
  refresh_interval 2
  rotate_wait 10
  follow_inodes true
  emit_unmatched_lines true
  <parse>
    @type regexp
    expression /^(?<cri_time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[FP]) (?<message>.*)$/
  </parse>
</source>

<filter trafficops.app>
  @type parser
  key_name message
  reserve_data true
  reserve_time true
  remove_key_name_field true
  emit_invalid_record_to_error true
  <parse>
    @type json
  </parse>
</filter>

<match trafficops.app>
  @type file
  path /logs/trafficops
  append false
  <format>
    @type json
  </format>
  <buffer time>
    @type file
    path /fluentd-buffers/chunks
    timekey 10s
    timekey_wait 1s
    timekey_use_utc true
    flush_mode interval
    flush_interval 2s
    chunk_limit_size 1m
    total_limit_size 64m
    overflow_action throw_exception
    retry_forever true
    retry_max_interval 30
  </buffer>
</match>

<label @ERROR>
  <match **>
    @type file
    path /logs/trafficops-parse-errors
    append false
    <format>
      @type json
    </format>
    <buffer time>
      @type file
      path /fluentd-buffers/parse-errors
      timekey 10s
      timekey_wait 1s
      timekey_use_utc true
      flush_mode interval
      flush_interval 2s
      chunk_limit_size 1m
      total_limit_size 16m
      overflow_action throw_exception
      retry_forever true
      retry_max_interval 30
    </buffer>
  </match>
</label>
